<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한울모임 골프동호회</title>
  <style>
    :root {
      --bg-dark: #0b1914;
      --card-dark: #132820;
      --card-border: #1e3f33;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --green-accent: #10b981;
      --red-accent: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 50px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }

    /* 1. 로그인 화면 (MEMBERS ONLY) */
    #login-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #163329 0%, #09130f 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }
    .badge-members {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .login-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .login-box {
      width: 100%;
      max-width: 300px;
    }
    .login-box input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #d4af37, #b59226);
      color: #0b1914;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .login-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
      line-height: 1.5;
    }

    /* 2. 상단 헤더 & 10개 메뉴 네비게이션 */
    header {
      padding: 18px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: #0d1f18;
    }
    .header-left span { font-size: 11px; color: var(--gold); display: block; letter-spacing: 1px; }
    .header-left h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .btn-admin {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-grid {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 10px 12px;
      background: #0b1914;
      border-bottom: 1px solid var(--card-border);
      scrollbar-width: none;
    }
    .nav-grid::-webkit-scrollbar { display: none; }
    .nav-btn {
      background: var(--card-dark);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn.active {
      background: var(--gold);
      color: #0b1914;
      border-color: var(--gold);
      font-weight: 800;
    }
    .admin-only { display: none; }

    /* 3. 메인 카드 & 테이블 스타일 */
    .content { padding: 14px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: var(--text-muted); font-weight: 600; padding: 8px 4px; border-bottom: 1px solid var(--card-border); text-align: center; }
    td { padding: 11px 4px; border-bottom: 1px solid rgba(30, 63, 51, 0.5); text-align: center; }
    tr:last-child td { border-bottom: none; }
    .rank-badge { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-weight: 800; font-size: 12px; }
    .rank-1 { background: var(--gold); color: #000; }
    .rank-2 { background: #cbd5e1; color: #000; }
    .rank-3 { background: #b45309; color: #fff; }

    /* 입력 폼 & 버튼 */
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0b1914;
      color: #fff;
      font-size: 14px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #0b1914;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    /* 라이브 스코어 & 개인 통계 뱃지 */
    .live-badge { background: var(--red-accent); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat-box { background: #0b1914; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--card-border); }
    .stat-box .val { font-size: 18px; font-weight: 800; color: var(--gold); margin-top: 4px; }
    .stat-box .lbl { font-size: 11px; color: var(--text-muted); }

    /* 업적 달성 팝업 (ACHIEVEMENT UNLOCKED) */
    #achievement-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .achieve-card {
      background: linear-gradient(145deg, #18382c, #0d1f18);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 1. 입장 비밀번호 화면 -->
  <div id="login-screen">
    <div class="badge-members">MEMBERS ONLY</div>
    <div style="font-size: 13px; color: var(--gold); margin-bottom: 4px;">한울모임 골프동호회</div>
    <div class="login-title">HANUL GOLF</div>
    <div class="login-sub">월례 라운드 · 스코어보드</div>
    <div class="login-box">
      <input type="password" id="pw-input" placeholder="공용 비밀번호">
      <button onclick="loginMember()">입장하기</button>
    </div>
    <div class="login-hint">비밀번호는 총무에게 문의하세요<br>한 번 입장하면 이 기기에서 30일간 유지됩니다</div>
  </div>

  <!-- 2. 상단 헤더 -->
  <header>
    <div class="header-left">
      <span>HANUL GOLF CLUB</span>
      <h1>LEADERBOARD</h1>
    </div>
    <button class="btn-admin" id="admin-btn" onclick="toggleAdmin()">관리자 로그인</button>
  </header>

  <!-- 3. 10개 전체 메뉴 탭 -->
  <nav class="nav-grid">
    <button class="nav-btn active" onclick="switchTab('t-handi', this)">🏆 핸디 순위</button>
    <button class="nav-btn" onclick="switchTab('t-monthly', this)">📅 월별 성적</button>
    <button class="nav-btn" onclick="switchTab('t-live', this)">⛳ 라이브</button>
    <button class="nav-btn" onclick="switchTab('t-rounds', this)">📋 라운딩</button>
    <button class="nav-btn" onclick="switchTab('t-personal', this)">🎒 개인</button>
    <button class="nav-btn" onclick="switchTab('t-members', this)">👥 회원</button>
    <button class="nav-btn" onclick="switchTab('t-finance', this)">💰 회비 내역</button>
    <button class="nav-btn" onclick="switchTab('t-tourney', this)">🏆 대회 모드</button>
    <button class="nav-btn" onclick="switchTab('t-news', this)">📣 소식</button>
    <button class="nav-btn admin-only" onclick="switchTab('t-input', this)">✏ 스코어 입력</button>
    <button class="nav-btn admin-only" onclick="switchTab('t-settings', this)">⚙ 설정</button>
  </nav>

  <!-- 4. 본문 영역 -->
  <div class="content">

    <!-- 🏆 핸디 순위 -->
    <div id="t-handi" class="tab-pane active">
      <div class="card">
        <div class="card-title"><span>🏆 시즌 누적 핸디 순위</span><span style="font-size:11px; color:var(--text-muted);">72타 기준 자동산출</span></div>
        <table>
          <thead><tr><th>순위</th><th>회원명</th><th>평균타수</th><th>핸디캡</th><th>참여</th></tr></thead>
          <tbody id="handi-tbody"><tr><td colspan="5">기록을 불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 📅 월별 성적 -->
    <div id="t-monthly" class="tab-pane">
      <div class="card">
        <div class="card-title"><span>📅 월례회 성적 조회</span></div>
        <div class="form-row"><input type="month" id="month-filter" onchange="renderAll()"></div>
        <table>
          <thead><tr><th>순위</th><th>회원명</th><th>골프장</th><th>스코어</th></tr></thead>
          <tbody id="monthly-tbody"><tr><td colspan="4">월을 선택하거나 기록을 등록하세요.</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ⛳ 라이브 -->
    <div id="t-live" class="tab-pane">
      <div class="card">

  <!-- Firebase 연동 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, onValue, push, set } from "https://gstatic.com";

    // ⚠️ [중요] 아래 firebaseConfig 부분을 본인의 Firebase 설정값으로 교체하세요!
    const firebaseConfig = {
      apiKey: "AIzaSyB10lgpcSe2B8gWyqaPUH6CdaTaTxlxjYM",
      authDomain: "hanul-golf.firebaseapp.com",
      databaseURL: "https://hanul-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hanul-golf",
      storageBucket: "hanul-golf.firebasestorage.app",
      messagingSenderId: "99869543437",
      appId: "1:99869543437:web:8e65edb81676569d03d944"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 기본 비밀번호 설정 (원하시는 번호로 변경 가능)
    const MEMBER_PW = "1234"; // 회원 공용 비밀번호
    const ADMIN_PW = "9999";  // 총무(관리자) 비밀번호

    // 1. 30일 로그인 유지 확인
    window.addEventListener('DOMContentLoaded', () => {
      const savedExpiry = localStorage.getItem('golf_auth_expiry');
      if (savedExpiry && new Date().getTime() < Number(savedExpiry)) {
        document.getElementById('login-screen').style.display = 'none';
      }
    });

    window.checkMemberLogin = () => {
      const input = document.getElementById('member-pw-input').value;
      if (input === MEMBER_PW) {
        const thirtyDays = 30 * 24 * 60 * 60 * 1000;
        localStorage.setItem('golf_auth_expiry', new Date().getTime() + thirtyDays);
        document.getElementById('login-screen').style.display = 'none';
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    };

    // 2. 관리자 모드 전환
    let isAdmin = false;
    window.toggleAdminMode = () => {
      if (!isAdmin) {
        const pw = prompt("관리자 비밀번호를 입력하세요:");
        if (pw === ADMIN_PW) {
          isAdmin = true;
          document.getElementById('admin-toggle-btn').innerText = "관리자 로그아웃";
          document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
          alert("관리자 모드가 활성화되었습니다.");
        } else if (pw !== null) {
          alert("관리자 비밀번호가 틀렸습니다.");
        }
      } else {
        isAdmin = false;
        document.getElementById('admin-toggle-btn').innerText = "관리자 로그인";
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        openTab('tab-rank', document.querySelector('nav button'));
      }
    };

    // 3. 탭 이동 기능
    window.openTab = (tabId, btn) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(btn) btn.classList.add('active');
    };

    // 4. 스코어 저장 & 실시간 순위 계산
    window.saveScore = () => {
      const date = document.getElementById('in-date').value;
      const course = document.getElementById('in-course').value.trim();
      const player = document.getElementById('in-player').value.trim();
      const score = Number(document.getElementById('in-score').value);

      if (!date || !course || !player || !score) return alert("모든 항목을 입력하세요.");

      push(ref(db, 'rounds'), { date, course, player, score })
        .then(() => {
          alert("스코어가 저장되었습니다!");
