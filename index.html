<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골프 동호회 리더보드</title>
  <style>
    :root { --primary: #1b4332; --accent: #d4af37; --bg: #f4f6f5; --card: #ffffff; --text: #222; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }
    
    /* 로그인 화면 */
    #login-screen { position: fixed; inset: 0; background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 20px; text-align: center; }
    #login-screen h1 { color: var(--accent); letter-spacing: 2px; margin-bottom: 5px; }
    #login-screen input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 100%; max-width: 280px; margin: 15px 0; text-align: center; }
    #login-screen button { padding: 12px 30px; font-size: 16px; font-weight: bold; background: var(--accent); color: #111; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 280px; }

    /* 상단 헤더 및 메뉴 */
    header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; font-size: 18px; color: var(--accent); }
    .admin-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    
    nav { display: flex; overflow-x: auto; background: #143326; padding: 8px; gap: 8px; }
    nav button { background: transparent; color: #ccc; border: none; padding: 8px 14px; border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; }
    nav button.active { background: var(--accent); color: #111; font-weight: bold; }
    .admin-only { display: none; }

    /* 본문 컨테이너 및 카드 */
    .container { max-width: 600px; margin: 15px auto; padding: 0 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

    /* 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
    th, td { padding: 10px 6px; border-bottom: 1px solid #eee; }
    th { color: #666; font-weight: 600; background: #fafafa; }
    .rank-1 { color: #d4af37; font-weight: bold; }

    /* 입력 폼 스타일 */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .submit-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .plus { color: #2b8a3e; font-weight: bold; }
    .minus { color: #c92a2a; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. 공용 비밀번호 입장 화면 -->
  <div id="login-screen">
    <p style="font-size: 12px; opacity: 0.8; margin: 0;">MEMBERS ONLY</p>
    <h1>ROYAL GOLF CLUB</h1>
    <p style="font-size: 14px; opacity: 0.9;">월례 라운드 · 스코어보드</p>
    <input type="password" id="member-pw-input" placeholder="공용 비밀번호 입력">
    <button onclick="checkMemberLogin()">입장하기</button>
    <p style="font-size: 11px; opacity: 0.6; margin-top: 15px;">한 번 입장하면 이 기기에서 30일간 유지됩니다.</p>
  </div>

  <!-- 2. 상단 헤더 & 네비게이션 -->
  <header>
    <h2>🏆 LEADERBOARD</h2>
    <button class="admin-btn" id="admin-toggle-btn" onclick="toggleAdminMode()">관리자 로그인</button>
  </header>

  <nav>
    <button class="active" onclick="openTab('tab-rank', this)">🏆 핸디 순위</button>
    <button onclick="openTab('tab-rounds', this)">📋 라운딩 기록</button>
    <button onclick="openTab('tab-finance', this)">💰 회비 내역</button>
    <button class="admin-only" onclick="openTab('tab-input', this)">✏ 스코어/회비 입력</button>
  </nav>

  <!-- 3. 메인 화면 콘텐츠 -->
  <div class="container">
    
    <!-- 탭 1: 핸디 순위 -->
    <div id="tab-rank" class="tab-content active">
      <div class="card">
        <h3>📊 실시간 회원 핸디캡 & 평균 타수</h3>
        <table>
          <thead>
            <tr><th>순위</th><th>이름</th><th>평균타수</th><th>현재핸디</th><th>참여수</th></tr>
          </thead>
          <tbody id="rank-tbody">
            <tr><td colspan="5">데이터를 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 탭 2: 라운딩 기록 -->
    <div id="tab-rounds" class="tab-content">
      <div id="rounds-list">
        <div class="card">기록을 불러오는 중...</div>
      </div>
    </div>

    <!-- 탭 3: 회비 내역 -->
    <div id="tab-finance" class="tab-content">
      <div class="card">
        <h3>💳 현재 회비 잔액: <span id="total-balance" style="color:var(--primary);">0</span>원</h3>
        <table>
          <thead>
            <tr><th>날짜</th><th>내용</th><th>구분</th><th>금액</th></tr>
          </thead>
          <tbody id="finance-tbody">
            <tr><td colspan="4">내역을 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 탭 4: 관리자 입력 화면 -->
    <div id="tab-input" class="tab-content">
      <div class="card">
        <h3>⛳ 새 라운딩 스코어 등록</h3>
        <div class="form-group"><label>날짜</label><input type="date" id="in-date"></div>
        <div class="form-group"><label>골프장명</label><input type="text" id="in-course" placeholder="예: 레이크사이드 CC"></div>
        <div class="form-group"><label>회원 이름</label><input type="text" id="in-player" placeholder="예: 홍길동"></div>
        <div class="form-group"><label>최종 타수 (Gross)</label><input type="number" id="in-score" placeholder="예: 84"></div>
        <button class="submit-btn" onclick="saveScore()">스코어 저장하기</button>
      </div>

      <div class="card">
        <h3>💰 회비 입출금 등록</h3>
        <div class="form-group"><label>날짜</label><input type="date" id="fin-date"></div>
        <div class="form-group"><label>내용</label><input type="text" id="fin-desc" placeholder="예: 11월 월회비 입금 / 그늘집 식대"></div>
        <div class="form-group">
          <label>구분</label>
          <select id="fin-type"><option value="in">입금 (+)</option><option value="out">출금 (-)</option></select>
        </div>
        <div class="form-group"><label>금액 (원)</label><input type="number" id="fin-amount" placeholder="예: 50000"></div>
        <button class="submit-btn" onclick="saveFinance()">회비 내역 저장</button>
      </div>
    </div>

  </div>

  <!-- Firebase 연동 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, onValue, push, set } from "https://gstatic.com";

    // ⚠️ [중요] 아래 firebaseConfig 부분을 본인의 Firebase 설정값으로 교체하세요!
    const firebaseConfig = {
      apiKey: "AIzaSyB10lgpcSe2B8gWyqaPUH6CdaTaTxlxjYM",
      authDomain: "hanul-golf.firebaseapp.com",
      databaseURL: "https://hanul-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hanul-golf",
      storageBucket: "hanul-golf.firebasestorage.app",
      messagingSenderId: "99869543437",
      appId: "1:99869543437:web:8e65edb81676569d03d944"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 기본 비밀번호 설정 (원하시는 번호로 변경 가능)
    const MEMBER_PW = "1234"; // 회원 공용 비밀번호
    const ADMIN_PW = "9999";  // 총무(관리자) 비밀번호

    // 1. 30일 로그인 유지 확인
    window.addEventListener('DOMContentLoaded', () => {
      const savedExpiry = localStorage.getItem('golf_auth_expiry');
      if (savedExpiry && new Date().getTime() < Number(savedExpiry)) {
        document.getElementById('login-screen').style.display = 'none';
      }
    });

    window.checkMemberLogin = () => {
      const input = document.getElementById('member-pw-input').value;
      if (input === MEMBER_PW) {
        const thirtyDays = 30 * 24 * 60 * 60 * 1000;
        localStorage.setItem('golf_auth_expiry', new Date().getTime() + thirtyDays);
        document.getElementById('login-screen').style.display = 'none';
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    };

    // 2. 관리자 모드 전환
    let isAdmin = false;
    window.toggleAdminMode = () => {
      if (!isAdmin) {
        const pw = prompt("관리자 비밀번호를 입력하세요:");
        if (pw === ADMIN_PW) {
          isAdmin = true;
          document.getElementById('admin-toggle-btn').innerText = "관리자 로그아웃";
          document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
          alert("관리자 모드가 활성화되었습니다.");
        } else if (pw !== null) {
          alert("관리자 비밀번호가 틀렸습니다.");
        }
      } else {
        isAdmin = false;
        document.getElementById('admin-toggle-btn').innerText = "관리자 로그인";
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        openTab('tab-rank', document.querySelector('nav button'));
      }
    };

    // 3. 탭 이동 기능
    window.openTab = (tabId, btn) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(btn) btn.classList.add('active');
    };

    // 4. 스코어 저장 & 실시간 순위 계산
    window.saveScore = () => {
      const date = document.getElementById('in-date').value;
      const course = document.getElementById('in-course').value.trim();
      const player = document.getElementById('in-player').value.trim();
      const score = Number(document.getElementById('in-score').value);

      if (!date || !course || !player || !score) return alert("모든 항목을 입력하세요.");

      push(ref(db, 'rounds'), { date, course, player, score })
        .then(() => {
          alert("스코어가 저장되었습니다!");
